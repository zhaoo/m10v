<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>支持 M10V · GR固件工作台</title>
  <link rel="icon" type="image/png" href="/shared/m10v-favicon.png">
  <link rel="stylesheet" href="/shared/brand.css">
  <link rel="stylesheet" href="/shared/navigation.css">
  <link rel="stylesheet" href="/shared/support.css">
  <script type="module" src="/shared/navigation.js"></script>
</head>
<body>
  <header><a class="m10v-brand" href="/" aria-label="m10v · GR固件工作台 首页"><img class="m10v-mark" src="/shared/m10v-logo.png" width="38" height="38" alt=""><span class="m10v-brand-name"><b>m10v</b><span class="brand-dot">·</span>GR固件工作台</span></a></header>
  <main id="support-page" class="support-page">
    <p class="support-eyebrow">THANK YOU FOR YOUR SUPPORT</p>
    <h1>喜欢 M10V，请我喝杯咖啡</h1>
    <p class="support-intro">如果 M10V 为你的拍摄带来了乐趣，欢迎随心打赏，支持项目持续开发与维护。<br>金额随意，每一份支持都心怀感谢。</p>
    <div class="support-methods">
      <section class="support-card" aria-labelledby="alipay-title">
        <h2 id="alipay-title">支付宝</h2>
        <p>打开支付宝，扫一扫下方收款码</p>
        <a class="support-image" href="/shared/support/alipay.jpg" target="_blank" rel="noopener noreferrer" aria-label="查看支付宝收款码原图，新窗口打开"><img src="/shared/support/alipay.jpg" width="1080" height="1620" alt="M10V 作者支付宝收款码，收款人兆兆（**杰）"></a>
        <a class="support-download" href="/shared/support/alipay.jpg" download="m10v-alipay.jpg">保存支付宝收款码 ↓</a>
      </section>
      <section class="support-card" aria-labelledby="wechat-title">
        <h2 id="wechat-title">微信支付</h2>
        <p>打开微信，扫一扫下方收款码</p>
        <a class="support-image" href="/shared/support/wechat.png" target="_blank" rel="noopener noreferrer" aria-label="查看微信收款码原图，新窗口打开"><img src="/shared/support/wechat.png" width="1242" height="1692" alt="M10V 作者微信收款码，收款人兆兆（**杰）"></a>
        <a class="support-download" href="/shared/support/wechat.png" download="m10v-wechat.png">保存微信收款码 ↓</a>
      </section>
    </div>
    <p class="support-note">手机浏览可保存收款码，再在对应支付应用的扫一扫中从相册识别；也可点击图片查看原图。<br>打赏完全自愿，不影响固件下载与功能使用。本站不记录付款状态。</p>
    <a class="support-back" href="/gr3/">返回工作台 →</a>
  </main>
  <footer>m10v · 感谢你陪这个项目一起成长</footer>
</body>
</html>
