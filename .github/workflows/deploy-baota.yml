name: Deploy Baota
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baota-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify changelog for this release
        env:
          CHANGELOG_BASE: ${{ github.event.before }}
        run: node scripts/check_changelog.mjs
      - name: Verify deployment controls
        run: |
          node --test node/github-webhook.test.mjs node/server-deployment.test.mjs node/changelog.test.mjs
          python3 -m unittest tests.test_baota_publish tests.test_ssh_deploy tests.test_gr4_codec_memory vendor.gr4.tests.test_codec
      - name: Deploy verified Git bundle over restricted SSH
        env:
          DEPLOY_HOST: ${{ vars.M10V_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.M10V_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.M10V_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          key="$RUNNER_TEMP/m10v-deploy-key"
          hosts="$RUNNER_TEMP/m10v-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          # This prerequisite is the last confirmed successful production deploy.
          git bundle create /tmp/m10v-release.bundle 725e2bf15f7e01caa4f26ffaaa48d41c068d2f74..HEAD
          git bundle verify /tmp/m10v-release.bundle
          bundle_bytes=$(wc -c < /tmp/m10v-release.bundle)
          test "$bundle_bytes" -le $((24 * 1024 * 1024))
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            root@"$DEPLOY_HOST" "deploy $GITHUB_SHA" \
            < /tmp/m10v-release.bundle | tee /tmp/m10v-deploy.log
          grep -F "DEPLOY_OK commit=$GITHUB_SHA " /tmp/m10v-deploy.log
